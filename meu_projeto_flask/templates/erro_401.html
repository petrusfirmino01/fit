{% extends "base.html" %}

{% block title %}401 Não Autorizado - Portal Saúde & Bem-Estar{% endblock %}

{% block content %}
<div class="error-box">
    <div style="font-size: 3rem;">🔒</div>
    <h1 class="error-code-401">HTTP 401: NÃO AUTORIZADO</h1>
    <h2 style="margin-bottom: 10px;">Acesso Restrito</h2>
    <p style="color: var(--texto-suave); margin-bottom: 22px;">
        Você precisa estar logado para acessar esta página.<br>
        Por favor, autentique-se para continuar.
    </p>
    <a href="{{ url_for('login') }}" class="btn btn-primary">Ir para o Login</a>
</div>
{% endblock %}
