{% extends "base.html" %}

{% block title %}Login - Portal Saúde & Bem-Estar{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Entrar na sua conta</h1>

    <form action="{{ url_for('login') }}" method="POST" id="loginForm">
        <div class="form-group">
            <label for="email">Usuário/E-mail</label>
            <input type="text" id="email" name="email" value="{{ email or '' }}" placeholder="Usuário/E-mail" required>
        </div>

        <div class="form-group">
            <label for="senha">Senha</label>
            <div class="password-wrapper">
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                <button type="button" class="toggle-password" id="toggleSenha" aria-label="Exibir ou ocultar senha">👁</button>
            </div>
        </div>

        <div id="capsAlert" class="caps-alert">⚠️ Atenção: Caps Lock ativado</div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
    </form>

    <div class="auth-link">
        Não tem conta? <a href="{{ url_for('register') }}">Criar conta</a>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const senhaInput = document.getElementById("senha");
    const toggleBtn = document.getElementById("toggleSenha");
    const capsAlert = document.getElementById("capsAlert");

    toggleBtn.addEventListener("click", () => {
        const isPass = senhaInput.type === "password";
        senhaInput.type = isPass ? "text" : "password";
    });

    function checkCapsLock(event) {
        if (typeof event.getModifierState === "function") {
            if (event.getModifierState("CapsLock")) {
                capsAlert.classList.add("visible");
            } else {
                capsAlert.classList.remove("visible");
            }
        }
    }

    ["keydown", "keyup", "focus"].forEach((evName) => {
        senhaInput.addEventListener(evName, checkCapsLock);
    });

    window.addEventListener("keydown", (e) => {
        if (document.activeElement === senhaInput) {
            checkCapsLock(e);
        }
    });
</script>
{% endblock %}
