{% extends "base.html" %}

{% block title %}403 Proibido - Portal Saúde & Bem-Estar{% endblock %}

{% block content %}
<div class="error-box">
    <div style="font-size: 3rem;">🛡️</div>
    <h1 class="error-code-403">HTTP 403 Forbidden</h1>
    <h2 style="margin-bottom: 10px;">Acesso Restrito a Administradores</h2>
    <p style="color: var(--texto-suave); margin-bottom: 22px;">
        Sua conta não possui permissão de administrador para acessar esta área.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Voltar para o Início</a>
</div>
{% endblock %}
